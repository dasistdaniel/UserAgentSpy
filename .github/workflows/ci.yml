name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest 22.x (the major-version floor node:sqlite needs) and 24
        # (matches the node:24-alpine image this actually deploys with).
        # NOT pinned to the exact patch 22.5.0: CI caught that build missing
        # node:sqlite entirely (ERR_UNKNOWN_BUILTIN_MODULE) — it only landed
        # in a later 22.x patch, so the engines field no longer claims .5.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Zero dependencies — no npm install/ci step needed.
      - name: Syntax-check every source file
        run: for f in src/*.js; do node --check "$f"; done

      - name: Run tests
        run: npm test
