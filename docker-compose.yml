services:
  app:
    build: .
    image: useragents-spy:latest
    container_name: useragents-spy
    restart: unless-stopped
    environment:
      PORT: "7060"
      DB_PATH: /data/app.db
      # Direct test without a reverse proxy: don't trust forwarded headers,
      # use the real socket IP. Flip to "true" once a proxy sits in front.
      TRUST_PROXY: "false"
      # Test value; change to https://useragents.nichtregistriert.de when the
      # domain + proxy are live (affects robots.txt / sitemap.xml / footer links).
      BASE_URL: http://192.168.178.20:7060
      # IndexNow key: pings Bing + Yandex to crawl our URLs (once/day, only on an
      # https BASE_URL). Generate one: `openssl rand -hex 16`. Leave empty to disable.
      INDEXNOW_KEY: ""
    volumes:
      - uaspy-data:/data
    ports:
      # Exposed on all interfaces for LAN testing. For the proxy setup later,
      # change to "127.0.0.1:7060:7060".
      - "7060:7060"

volumes:
  uaspy-data:
