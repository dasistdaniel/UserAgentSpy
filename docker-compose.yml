services:
  app:
    build: .
    image: user-agent-spy:latest
    container_name: user-agent-spy
    restart: unless-stopped
    environment:
      PORT: "7060"
      DB_PATH: /data/app.db
      # Direct test without a reverse proxy: don't trust forwarded headers,
      # use the real socket IP. Flip to "true" once a proxy sits in front.
      TRUST_PROXY: "false"
      # Test value; change to your real https://your-domain when the domain +
      # proxy are live (affects robots.txt / sitemap.xml / footer links).
      BASE_URL: http://<your-host-ip>:7060
      # IndexNow key: pings Bing + Yandex to crawl our URLs (once/day, only on an
      # https BASE_URL). Generate one: `openssl rand -hex 16`. Leave empty to disable.
      INDEXNOW_KEY: ""
      # Google Search Console: token from the googleXXXX.html verification file
      # (.html suffix optional). Empty = route disabled.
      GOOGLE_VERIFY: ""
      # Raw per-request rows older than this many days are pruned daily; the
      # user_agents catalogue is kept forever. 0 = keep everything.
      VISITS_RETENTION_DAYS: "90"
      # Fake 200s for scanner probes (/wp-login.php, /.env, …) instead of 404s.
      # More aggressive than the default honeypot stance, so opt-in.
      FAKE_ENDPOINTS: ""
      # Visit any page with ?nolog=<this> once to stop logging your own browser
      # (sets a long-lived cookie). Generate one: `openssl rand -hex 16`. Empty
      # = feature disabled, no cookie is ever set.
      NOLOG_KEY: ""
      # Per-IP-hash rate limit: RATE_LIMIT_MAX requests per RATE_LIMIT_WINDOW_S
      # seconds. Protects against a genuine flood, not ordinary crawler
      # traffic — keep this generous. 0 disables it.
      RATE_LIMIT_MAX: "300"
      RATE_LIMIT_WINDOW_S: "10"
    volumes:
      - uaspy-data:/data
    ports:
      # Exposed on all interfaces for LAN testing. For the proxy setup later,
      # change to "127.0.0.1:7060:7060".
      - "7060:7060"

volumes:
  uaspy-data:
